<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c0913" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Stremio TV</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Coloca tu logo principal exactamente en: img/logo.png -->
  <section id="splash" class="splash" aria-label="Iniciando reproductor">
    <div class="splash__glow" aria-hidden="true"></div>

    <img
      src="img/logo.png"
      alt="Logo"
      class="splash__logo"
      onerror="this.hidden=true; document.getElementById('splashFallback').hidden=false"
    />

    <div id="splashFallback" class="splash__fallback" hidden>
      <span>▶</span>
      <strong>TV</strong>
    </div>

    <div class="splash__loading" aria-hidden="true"><span></span></div>
  </section>

  <main id="app" class="app" hidden>
    <header class="header">
      <a class="brand" href="#top" aria-label="Ir al inicio">
        <img src="img/logo.png" alt="Logo" class="brand__logo" onerror="this.hidden=true" />
        <span class="brand__text">TV</span>
      </a>

      <button id="scrollSearchBtn" class="round-button" type="button" aria-label="Buscar canales">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z"/></svg>
      </button>
    </header>

    <section id="top" class="player" aria-label="Reproductor">
      <div class="player__screen">
        <video id="video" playsinline controls preload="metadata"></video>

        <div id="playerEmpty" class="player__empty">
          <span class="player__empty-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 7 8 5-8 5V7Z"/></svg>
          </span>
          <strong>Selecciona un canal</strong>
          <small>La emisión aparecerá aquí</small>
        </div>

        <div id="playerLoading" class="player__loading" hidden>
          <span class="spinner" aria-hidden="true"></span>
          <small>Conectando con el canal</small>
        </div>

        <div class="player__top-actions">
          <span class="live-label"><i></i> EN DIRECTO</span>

          <button id="reloadBtn" class="video-button" type="button" aria-label="Recargar canal">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.34 5.66M20 4v7h-7"/></svg>
          </button>

          <button id="fullscreenBtn" class="video-button" type="button" aria-label="Pantalla completa">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M8 21H3v-5m13 5h5v-5"/></svg>
          </button>
        </div>
      </div>

      <div class="now-playing">
        <div id="currentLogo" class="now-playing__logo"><span>TV</span></div>

        <div class="now-playing__copy">
          <small>REPRODUCIENDO AHORA</small>
          <strong id="currentChannel">Ningún canal</strong>
          <span id="currentMeta">Selecciona uno de la lista</span>
        </div>

        <button id="favoriteCurrentBtn" class="favorite-button" type="button" aria-label="Añadir a favoritos" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.78 5.63 6.22.9-4.5 4.39 1.06 6.2L12 17.2l-5.56 2.92 1.06-6.2L3 9.53l6.22-.9L12 3Z"/></svg>
        </button>
      </div>
    </section>

    <section class="library" aria-label="Biblioteca de canales">
      <div class="library__heading">
        <div>
          <small>BIBLIOTECA</small>
          <h1>Canales</h1>
        </div>
        <span id="channelCount" class="channel-count">0 canales</span>
      </div>

      <label class="search" for="searchInput">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z"/></svg>
        <input id="searchInput" type="search" placeholder="Buscar canal, país o categoría" autocomplete="off" />
        <button id="clearSearchBtn" type="button" aria-label="Limpiar búsqueda" hidden>×</button>
      </label>

      <div class="view-switch" role="tablist" aria-label="Organizar canales">
        <button class="view-switch__button is-active" type="button" data-view="country" role="tab" aria-selected="true">Países</button>
        <button class="view-switch__button" type="button" data-view="category" role="tab" aria-selected="false">Categorías</button>
        <button class="view-switch__button" type="button" data-view="favorites" role="tab" aria-selected="false">Favoritos</button>
      </div>

      <div id="groupsContainer" class="groups"></div>
    </section>

    <footer class="footer">
      <img src="img/logo.png" alt="" class="footer__logo" onerror="this.hidden=true" />
      <p>Reproduce únicamente listas y emisiones que tengas derecho a utilizar.</p>
    </footer>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
  <script src="script.js"></script>
</body>
</html>
